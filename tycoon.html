<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage Tycoon</title>
<meta name="description" content="Build a $5 million sports car rental empire: buy cars, set rental prices, manage risk and grow your net worth. A game by Adrien Pinilla.">
<meta property="og:title" content="Garage Tycoon">
<meta property="og:description" content="Turn $100,000 and a two-car garage into a $5M sports car rental empire.">
<meta name="theme-color" content="#0e0c0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0e0c0a;
  --panel: #17130f;
  --panel-2: #1e1914;
  --line: rgba(244, 236, 222, 0.1);
  --line-2: rgba(212, 166, 90, 0.28);
  --ivory: #f4ece0;
  --body: #d8cfc2;
  --muted: #a99d8c;
  --gold: #d4a65a;
  --gold-2: #f0c983;
  --green: #6fcf8e;
  --red: #ef6a5a;
  --blue: #6aa8ff;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --sans: "Inter", -apple-system, "Segoe UI", sans-serif;
  --floor: linear-gradient(180deg, #1b1714, #110f0d);
  --lamp: 0.16;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ivory); font: 400 14.5px/1.5 var(--sans); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--green); } .down { color: var(--red); } .dim { color: var(--muted); }

/* tier-driven look: the garage gets warmer and richer as it grows */
body[data-tier="1"] { --lamp: 0.2; }
body[data-tier="2"] { --lamp: 0.24; --floor: repeating-linear-gradient(45deg, rgba(150, 102, 58, .1) 0 12px, transparent 12px 24px), repeating-linear-gradient(-45deg, rgba(150, 102, 58, .07) 0 12px, transparent 12px 24px), linear-gradient(180deg, #221a13, #120e0b); }
body[data-tier="3"], body[data-tier="4"] { --lamp: 0.28; --floor: repeating-linear-gradient(45deg, rgba(176, 120, 64, .14) 0 12px, transparent 12px 24px), repeating-linear-gradient(-45deg, rgba(176, 120, 64, .1) 0 12px, transparent 12px 24px), linear-gradient(180deg, #2a1f15, #130e0a); }

/* ================= HUD ================= */
.hud { position: sticky; top: 0; z-index: 30; background: rgba(14, 12, 10, .9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.hud-row { max-width: 1240px; margin: 0 auto; padding: 12px 22px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font: 700 1.4rem/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; }
.brand small { font: 600 .7rem/1 var(--cond); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin-top: 4px; }
.kpis { display: flex; gap: 22px; margin-left: auto; align-items: center; }
.kpi small { display: block; font: 600 .66rem/1 var(--cond); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.kpi b { font: 700 1.25rem/1.15 var(--cond); letter-spacing: .02em; }
.stars { color: var(--gold); letter-spacing: 1px; font-size: .95rem; }
.stars i { font-style: normal; color: rgba(212, 166, 90, .25); }
.time { display: flex; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 15px; border: 1px solid var(--line-2); font: 600 .84rem/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; transition: background .2s, border-color .2s, color .2s, transform .1s; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--gold); color: var(--gold-2); }
.btn:active { transform: translateY(1px); }
.btn.gold { background: linear-gradient(180deg, #e2b56a, #c08f45); color: #1a1209; border-color: #c08f45; }
.btn.gold:hover { filter: brightness(1.08); color: #1a1209; }
.btn.ghost { border-color: var(--line); color: var(--body); }
.btn.danger { border-color: rgba(239, 106, 90, .5); color: #ffb4a8; }
.btn.danger:hover { border-color: var(--red); color: #fff; background: rgba(239, 106, 90, .15); }
.btn.sm { padding: 7px 10px; font-size: .74rem; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.date { text-align: right; }
.date b { font: 700 1rem/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; display: block; }
.date small { font-size: .7rem; color: var(--muted); }
.menu-btn { width: 38px; height: 38px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 1.1rem; }

.tabs { max-width: 1240px; margin: 0 auto; padding: 0 22px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 11px 14px 12px; font: 600 .86rem/1 var(--cond); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; display: flex; gap: 7px; align-items: center; white-space: nowrap; }
.tab:hover { color: var(--ivory); }
.tab.on { color: var(--ivory); border-color: var(--gold); }
.tab svg { width: 15px; height: 15px; }
.tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

main { max-width: 1240px; margin: 0 auto; padding: 24px 22px 80px; }
.view-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.view-head h1 { font: 700 2.1rem/1 var(--cond); letter-spacing: .03em; text-transform: uppercase; }
.view-head p { color: var(--muted); font-size: .9rem; margin-top: 4px; max-width: 640px; }
.eyebrow { font: 600 .72rem/1 var(--cond); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.card { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--body); white-space: nowrap; }
.chip.gold { border-color: var(--line-2); color: var(--gold-2); }
.chip.good { border-color: rgba(111, 207, 142, .4); color: #a8ecbd; }
.chip.bad { border-color: rgba(239, 106, 90, .4); color: #ffb4a8; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }

/* ================= Garage ================= */
.hq { position: relative; overflow: hidden; border-radius: 4px; border: 1px solid var(--line); padding: 26px 26px 22px; margin-bottom: 20px; min-height: 180px; display: flex; flex-direction: column; justify-content: flex-end; }
.hq::before { content: ""; position: absolute; inset: 0; background: url(assets/garage-overview.webp) center 62% / cover no-repeat; opacity: var(--hq-img, .14); filter: saturate(.85); }
.hq::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14, 12, 10, .95) 25%, rgba(14, 12, 10, .55) 70%, rgba(14, 12, 10, .3)), linear-gradient(0deg, rgba(14, 12, 10, .9), transparent 60%); }
.hq > * { position: relative; z-index: 1; }
.hq h1 { font: 700 2.4rem/1 var(--cond); text-transform: uppercase; letter-spacing: .03em; margin-top: 6px; }
.hq-meta { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px; align-items: end; }
.goal { flex: 1; min-width: 240px; max-width: 520px; }
.goal small { font-size: .74rem; color: var(--muted); display: flex; justify-content: space-between; }
.bar { height: 6px; background: rgba(244, 236, 222, .1); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, #b07f3a, var(--gold-2)); border-radius: 3px; transition: width .6s; }
.bays { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 16px; }
.bay { position: relative; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); text-align: left; display: flex; flex-direction: column; transition: border-color .2s, transform .2s; }
button.bay:hover { border-color: var(--line-2); transform: translateY(-2px); }
.bay-stage { position: relative; aspect-ratio: 16 / 8.6; background: radial-gradient(ellipse 55% 70% at 50% -5%, rgba(255, 214, 150, var(--lamp)), transparent 72%), var(--floor); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.bay-stage::before { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 14%; background: rgba(244, 236, 222, .2); }
.bay-stage::after { content: ""; position: absolute; left: calc(50% - 8px); top: 14%; width: 17px; height: 9px; border-radius: 8px 8px 2px 2px; background: radial-gradient(circle at 50% 80%, #ffe1ad, #d4a65a 60%, #6e4b22); box-shadow: 0 4px 26px 8px rgba(255, 200, 120, calc(var(--lamp) * 1.6)); }
.bay-stage svg { width: 88%; margin-bottom: 4%; position: relative; z-index: 1; filter: drop-shadow(0 10px 12px rgba(0, 0, 0, .55)); }
.bay-no { position: absolute; left: 10px; top: 8px; font: 700 .7rem/1 var(--cond); letter-spacing: .2em; color: rgba(244, 236, 222, .35); z-index: 2; }
.bay-status { position: absolute; right: 10px; top: 8px; z-index: 2; }
.plaque { padding: 12px 14px 14px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.plaque b { font: 700 1.12rem/1.15 var(--cond); letter-spacing: .02em; text-transform: uppercase; }
.plaque .v { font: 700 1.12rem/1.15 var(--cond); text-align: right; }
.plaque small { font-size: .74rem; color: var(--muted); }
.plaque .mini-bar { grid-column: 1 / -1; height: 3px; margin-top: 8px; background: rgba(244, 236, 222, .08); border-radius: 2px; overflow: hidden; }
.plaque .mini-bar span { display: block; height: 100%; background: var(--gold); }
.bay.empty-bay { border-style: dashed; align-items: center; justify-content: center; min-height: 230px; color: var(--muted); gap: 8px; text-align: center; padding: 20px; }
.bay.empty-bay b { font: 700 1.1rem/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--body); }
.bay.locked { opacity: .75; }
.plus { width: 46px; height: 46px; border-radius: 50%; border: 1px dashed var(--line-2); display: grid; place-items: center; font-size: 1.4rem; color: var(--gold); }
.status { font: 600 .66rem/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; padding: 5px 7px; border-radius: 2px; background: rgba(14, 12, 10, .75); border: 1px solid var(--line); }
.status.rented { color: #a8ecbd; border-color: rgba(111, 207, 142, .35); }
.status.idle { color: var(--muted); }
.status.service { color: #ffcf8a; border-color: rgba(240, 201, 131, .4); }
.status.off { color: #9fb6d9; }

/* ================= Marketplace ================= */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { padding: 8px 12px; font: 600 .78rem/1 var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.seg button.on { background: rgba(212, 166, 90, .14); color: var(--gold-2); }
select { background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; border-radius: 3px; font-size: .82rem; }
.market { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.listing { display: flex; flex-direction: column; overflow: hidden; position: relative; }
.listing .bay-stage { aspect-ratio: 16 / 7; }
.listing .tagline { position: absolute; left: 10px; top: 10px; z-index: 2; display: flex; gap: 6px; }
.l-body { padding: 14px 16px 16px; display: grid; gap: 10px; flex: 1; }
.l-title { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.l-title b { font: 700 1.25rem/1.1 var(--cond); text-transform: uppercase; letter-spacing: .02em; }
.l-title small { display: block; color: var(--muted); font-size: .76rem; }
.price b { font: 700 1.4rem/1 var(--cond); display: block; text-align: right; }
.price small { font-size: .72rem; display: block; text-align: right; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: rgba(244, 236, 222, .03); border: 1px solid var(--line); border-radius: 3px; padding: 7px 8px; }
.stats small { display: block; font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stats b { font: 700 1rem/1.2 var(--cond); }
.adv-line { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 3px; background: rgba(212, 166, 90, .06); border: 1px solid rgba(212, 166, 90, .14); }
.adv-line p { font-size: .8rem; color: var(--body); line-height: 1.35; }
.ring { --p: 50; --c: var(--gold); width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--c) calc(var(--p) * 1%), rgba(244, 236, 222, .1) 0); position: relative; }
.ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--panel-2); }
.ring b { position: relative; font: 700 1.05rem/1 var(--cond); }
.ring.lg { width: 84px; height: 84px; }
.ring.lg::before { inset: 6px; }
.ring.lg b { font-size: 2rem; }
.l-actions { display: flex; gap: 8px; align-items: center; }
.l-actions .btn { flex: 1; }
.cmp { display: flex; gap: 6px; align-items: center; font-size: .74rem; color: var(--muted); white-space: nowrap; cursor: pointer; }
.cmp input { accent-color: var(--gold); }
.cmpbar { position: sticky; bottom: 16px; z-index: 20; margin-top: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; background: rgba(23, 19, 15, .95); border: 1px solid var(--line-2); border-radius: 4px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }

/* ================= Tables / rentals ================= */
.rent-grid { display: grid; gap: 14px; }
.rent { display: grid; grid-template-columns: 220px 1fr 250px; gap: 18px; padding: 16px; align-items: center; }
.rent-car { display: flex; flex-direction: column; gap: 6px; }
.rent-car svg { width: 100%; }
.rent-car b { font: 700 1.1rem/1.1 var(--cond); text-transform: uppercase; }
.sliders { display: grid; gap: 12px; }
.slider label { display: flex; justify-content: space-between; font-size: .76rem; color: var(--muted); margin-bottom: 4px; }
.slider label b { color: var(--ivory); font: 700 1rem/1 var(--cond); }
input[type=range] { width: 100%; accent-color: var(--gold); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--body); cursor: pointer; }
.switch input { appearance: none; -webkit-appearance: none; width: 34px; height: 19px; border-radius: 10px; background: rgba(244, 236, 222, .15); position: relative; cursor: pointer; transition: background .2s; }
.switch input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--ivory); transition: transform .2s; }
.switch input:checked { background: var(--gold); }
.switch input:checked::after { transform: translateX(15px); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal span { aspect-ratio: 1; border-radius: 2px; background: rgba(244, 236, 222, .06); font-size: .56rem; display: grid; place-items: center; color: var(--muted); }
.cal span.b { background: rgba(212, 166, 90, .55); color: #1a1209; }
.cal span.o { background: rgba(106, 168, 255, .25); }
.cal-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; font-size: .56rem; color: var(--muted); text-align: center; margin-bottom: 3px; letter-spacing: .08em; }
.est { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.est div small { display: block; font-size: .64rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.est div b { font: 700 1.05rem/1.2 var(--cond); }

/* ================= Finances ================= */
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.k { padding: 14px 16px; }
.k small { display: block; font: 600 .68rem/1 var(--cond); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.k b { font: 700 1.6rem/1.15 var(--cond); display: block; margin-top: 6px; }
.k em { font-style: normal; font-size: .72rem; }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.panel { padding: 16px 18px; }
.panel h3 { font: 700 1.05rem/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.panel h3 small { font: 500 .74rem/1 var(--sans); letter-spacing: 0; text-transform: none; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: .74rem; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
table { width: 100%; border-collapse: collapse; font-size: .84rem; }
th { text-align: left; font: 600 .66rem/1 var(--cond); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); color: var(--body); vertical-align: middle; }
td.r, th.r { text-align: right; }
.table-wrap { overflow-x: auto; }

/* ================= Adviser ================= */
.adv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tip { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.tip:last-child { border-bottom: 0; }
.tip i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; background: rgba(212, 166, 90, .15); color: var(--gold-2); font-size: .8rem; font-weight: 700; }
.tip p { font-size: .86rem; color: var(--body); }
.tip p b { color: var(--ivory); }
.rank { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.rank:last-child { border-bottom: 0; }
.rank:hover b { color: var(--gold-2); }
.rank b { font: 700 1rem/1.1 var(--cond); text-transform: uppercase; }
.rank small { display: block; font-size: .72rem; color: var(--muted); }

/* ================= Achievements ================= */
.awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.award { padding: 18px; display: flex; gap: 14px; align-items: center; }
.medal { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 1.2rem/1 var(--cond); background: radial-gradient(circle at 35% 30%, #fbe1a9, #c08f45 55%, #6e4b22); color: #2a1a08; box-shadow: 0 0 0 3px rgba(212, 166, 90, .2), 0 6px 18px rgba(212, 166, 90, .25); }
.award.locked .medal { background: rgba(244, 236, 222, .06); color: var(--muted); box-shadow: none; border: 1px dashed var(--line); }
.award b { font: 700 1.05rem/1.1 var(--cond); text-transform: uppercase; letter-spacing: .03em; }
.award p { font-size: .8rem; color: var(--muted); }
.award small { font-size: .7rem; color: var(--gold); }

/* ================= Modals ================= */
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(6, 5, 4, .72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .25s; }
.veil.open { opacity: 1; pointer-events: auto; }
.modal { width: min(880px, 100%); max-height: calc(100dvh - 40px); overflow-y: auto; background: linear-gradient(180deg, #1f1a15, #15110e); border: 1px solid var(--line-2); border-radius: 6px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); transform: translateY(14px) scale(.98); transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
.veil.open .modal { transform: none; }
.modal.sm { width: min(520px, 100%); }
.m-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 20px 22px 0; }
.m-head h2 { font: 700 1.9rem/1 var(--cond); text-transform: uppercase; letter-spacing: .02em; margin-top: 6px; }
.m-head p { color: var(--muted); font-size: .84rem; margin-top: 4px; }
.x { width: 34px; height: 34px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 1rem; flex: none; }
.x:hover { border-color: var(--gold); }
.m-body { padding: 18px 22px 22px; }
.m-hero { position: relative; border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.m-hero .bay-stage { aspect-ratio: 16 / 6.2; }
.m-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.sec { padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; background: rgba(244, 236, 222, .02); }
.sec h4 { font: 700 .82rem/1 var(--cond); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; font-size: .84rem; }
.kv span { color: var(--muted); }
.kv b { font-weight: 600; text-align: right; }
.kv .sep { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 2px 0; }
.verdict { display: flex; gap: 16px; align-items: center; }
.verdict p { font-size: .88rem; color: var(--body); }

function stars(r) { var n = Math.round(r), s = ''; for (var i = 1; i <= 5; i++) s += i <= n ? '★' : '<i>★</i>'; return '<span class="stars" title="' + r.toFixed(1) + ' of 5">' + s + '</span> <span style="font-size:.8rem">' + r.toFixed(1) + '</span>'; }

/* ---------------- State ---------------- */
var SAVE_KEY = 'garageTycoon.v1';
var S;
function newGame() {
  S = {
    v: 1, week: 0, cash: START_CASH, rep: 3, tier: 0, nextId: 1,
    cars: [], loans: [], market: [], ledger: [], news: [],
    history: [{ w: 0, nw: START_CASH, cash: START_CASH }],
    months: {}, totals: { revenue: 0, bookings: 0, costs: 0 },
    trend: { sports: 1, luxury: 1, exotic: 1, collectible: 1 },
    mods: { ins: 1, heat: 0, show: 0 },
    awards: {}, tutorial: 0, negWeeks: 0, over: null, won: false, compare: []
  };
  seedMarket();
  log('Opened the garage with ' + money(START_CASH), START_CASH, 'Capital');
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try { var raw = localStorage.getItem(SAVE_KEY); if (raw) { var s = JSON.parse(raw); if (s && s.v === 1) { S = s; return true; } } } catch (e) {}
  return false;
}
function log(text, amount, cat) { S.ledger.unshift({ w: S.week, text: text, amt: amount, cat: cat || '' }); if (S.ledger.length > 80) S.ledger.length = 80; }
function bookMonth(kind, amt) { var k = monthKey(S.week); var m = S.months[k] || (S.months[k] = { rev: 0, exp: 0 }); m[kind] += amt; }

/* ---------------- Valuation & demand ---------------- */
function valueOf(m, year, miles, cond, week) {
  var M = MODELS[m];
  var age = (M.refYear - year) + week / 52;
  var ageF = Math.pow(1 - M.dep, age);
  var mileF = clamp(1 - (miles - M.refMiles) / 100000 * 0.25, 0.65, 1.12);
  var condF = clamp(0.7 + 0.3 * cond / 85, 0.75, 1.06);
  return M.value * ageF * mileF * condF * S.trend[M.cls];
}
function seasonOf(week) { return SEASON[dateOf(week).getMonth()]; }
function dayProb(m, cond, rate, weekend, opts) {
  opts = opts || {};
  var M = MODELS[m];
  var base = M.demand * DEMAND_SCALE * (weekend ? WEEKEND_LIFT : 1);
  var priceF = Math.min(1.6, Math.pow(M.rate / Math.max(rate, 1), PRICE_ELASTICITY));
  var season = opts.flat ? 1 : seasonOf(S.week) * (S.mods.heat > 0 ? 1.22 : 1) * (S.mods.show > 0 && M.exotic ? 1.5 : 1);
  var condF = 0.6 + 0.4 * cond / 100;
  var repF = 1 + (S.rep - 3) * 0.12;
  var wrapF = opts.wrap ? 1.04 : 1;
  return Math.min(0.92, base * priceF * season * condF * repF * wrapF);
}
function weeklyBookings(m, cond, rate, wkRate, opts) {
  var pd = dayProb(m, cond, rate, false, opts), pe = dayProb(m, cond, wkRate, true, opts);
  return { days: 5 * pd + 2 * pe, gross: 5 * pd * rate + 2 * pe * wkRate, util: (5 * pd + 2 * pe) / 7 };
}
function netPerDay(rate) { return rate * (1 - PLATFORM_FEE) - CLEANING; }
function deductible(m) { return MODELS[m].exotic ? 5000 : 2500; }
function damageP(m) { return 0.004 * (MODELS[m].exotic ? 1.25 : 1); }
function failP(car) { var p = 0.008 + (100 - car.cond) / 100 * 0.05; if (S.week - car.serviced < 8) p *= 0.5; return p; }
function suggestedRate(m) { return Math.round(MODELS[m].rate / 10) * 10; }
function suggestedWkRate(m) { return Math.round(MODELS[m].rate * 1.25 / 10) * 10; }

/* ---------------- Totals ---------------- */
function carsValue() { return S.cars.reduce(function (t, c) { return t + c.value; }, 0); }
function debt() { return S.loans.reduce(function (t, l) { return t + l.balance; }, 0); }
function netWorth() { return S.cash + carsValue() - debt(); }
function loanOf(carId) { for (var i = 0; i < S.loans.length; i++) if (S.loans[i].carId === carId) return S.loans[i]; return null; }
function bays() { return TIERS[S.tier].bays; }
function weeklyFixed() {
  var t = TIERS[S.tier].fee;
  S.cars.forEach(function (c) { var M = MODELS[c.model]; t += (M.ins * S.mods.ins * (c.listed ? 1 : 0.5) + M.maint) * 12 / 52; });
  S.loans.forEach(function (l) { t += l.pay; });
  return t;
}
function apr(downPct) { return clamp(0.065 + (3 - S.rep) * 0.006 + (downPct < 0.3 ? 0.01 : 0) + (debt() > 500000 ? 0.008 : 0), 0.049, 0.14); }
function maxDebt() { return 150000 + 1.5 * Math.max(0, netWorth()); }
function loanPayment(principal, rateYr, months) { var r = rateYr / 12; return principal * r / (1 - Math.pow(1 + r, -months)) * 12 / 52; }

/* ---------------- Marketplace ---------------- */
function genListing(force) {
  force = force || {};
  var key = force.model || pickW(Object.keys(MODELS), function (k) { return RARITY_WEIGHT[MODELS[k].rarity]; });
  var M = MODELS[key];
  var year = randi(M.years[0], M.years[1]);
  var miles = Math.max(800, Math.round(M.refMiles * (1 + (M.refYear - year) * 0.35) * rand(0.4, 1.8) / 10) * 10);
  var cond = Math.round(clamp(rand(68, 98) - (miles / M.refMiles - 1) * 5, 52, 99));
  var market = valueOf(key, year, miles, cond, S.week);
  var r = Math.random(), f, tag = null;
  if (force.f) f = force.f;
  else if (r < 0.06) f = rand(0.74, 0.82);
  else if (r < 0.28) f = rand(0.86, 0.95);
  else if (r < 0.76) f = rand(0.96, 1.06);
  else f = rand(1.08, 1.22);
  if (f < 0.84) tag = 'Hot deal'; else if (f > 1.12) tag = 'Overpriced';
  var hidden = Math.random() < (f < 0.85 ? 0.36 : 0.16) && !force.clean ? Math.round(market * rand(0.04, 0.12) / 100) * 100 : 0;
  var paint = Math.random() < 0.45 ? M.color : PAINTS[randi(0, PAINTS.length - 1)][1];
  return {
    id: S.nextId++, model: key, year: year, miles: miles, cond: cond, color: paint,
    market: Math.round(market / 100) * 100, ask: Math.round(market * f / 100) * 100, hidden: hidden, inspected: false,
    reserve: Math.round(market * f * (f > 1.08 ? rand(0.84, 0.92) : f < 0.9 ? rand(0.96, 1) : rand(0.9, 0.97)) / 100) * 100,
    weeks: force.weeks || randi(2, 5), tag: tag, offered: false, counter: null
  };
}
function seedMarket() {
  S.market = [
    genListing({ model: 'c8', f: 0.93, clean: true, weeks: 4 }),
    genListing({ model: ['c911', 'gtr', 'emira', 'amggt', 'i8'][randi(0, 4)], f: 0.99, weeks: 4 }),
    genListing({ model: ['huracan', 'f488', 'gt3'][randi(0, 2)], weeks: 5 })
  ];
  while (S.market.length < 7) S.market.push(genListing());
}
function refreshMarket() {
  S.market.forEach(function (l) { l.weeks--; });
  S.market = S.market.filter(function (l) { return l.weeks > 0; });
  var target = randi(7, 9);
  var adds = 0;
  while (S.market.length < target && adds < 4) { S.market.push(genListing()); adds++; }
  if (!S.market.some(function (l) { return l.ask <= Math.max(S.cash, 60000) * 1.4; })) S.market.push(genListing({ model: ['c8', 'i8', 'emira', 'amggt'][randi(0, 3)] }));
}

/* ---------------- AI investment adviser (transparent rules) ---------------- */
function analyze(l) {
  var M = MODELS[l.model];
  var cond = l.inspected && l.hidden ? l.cond - 12 : l.cond;
  var rate = suggestedRate(l.model), wk = suggestedWkRate(l.model);
  var wb = weeklyBookings(l.model, cond, rate, wk, { flat: true });
  var days = wb.days * 52;
  var gross = wb.gross * 52;
  var netRev = gross * (1 - PLATFORM_FEE) - days * CLEANING;
  var opex = (M.ins * S.mods.ins + M.maint) * 12 + days * damageP(l.model) * deductible(l.model) + (0.008 + (100 - cond) / 100 * 0.05) * 0.7 * 52 * l.market * 0.02;
  var known = l.inspected ? l.hidden : 0;
  var valChg = -M.dep * l.market;
  var discount = (l.market - l.ask) / l.market;
  var profit = netRev - opex + valChg;
  var roi = (profit + (l.market - l.ask) - known) / l.ask;
  var payback = (netRev - opex) > 0 ? (l.ask + known) / ((netRev - opex) / 12) : Infinity;
  var risk = { sports: 18, luxury: 28, exotic: 42, collectible: 32 }[M.cls];
  risk += clamp((M.maint * 12 / l.market) * 300, 0, 18);
  if (!l.inspected) risk += 14;
  if (cond < 70) risk += 14; else if (cond < 80) risk += 7;
  if (l.ask > S.cash * 0.8 + 1) risk += 10;
  if (discount < -0.08) risk += 8;
  risk = Math.round(clamp(risk, 5, 95));
  var riskLabel = risk < 35 ? 'Low' : risk < 60 ? 'Medium' : 'High';
  var notes = [];
  var adj = 0;
  var minDown = l.ask * 0.2;
  if (S.cash < minDown) { adj -= 15; notes.push('You can’t cover even a 20% down payment yet.'); }
  if (S.cars.length >= bays()) { adj -= 8; notes.push('No free bay: expand the garage or sell a car first.'); }
  var same = S.cars.filter(function (c) { return c.model === l.model; }).length;
  if (same >= 2) { adj -= 5; notes.push('You already own ' + same + ' of these; diversify.'); }
  var exoticShare = S.cars.length ? S.cars.filter(function (c) { return MODELS[c.model].exotic; }).length / S.cars.length : 0;
  if (M.exotic && exoticShare > 0.6 && S.cars.length >= 3) { adj -= 4; notes.push('Your garage is already exotic-heavy; bookings will be lumpy.'); }
  if (!M.exotic && S.cars.length >= 4 && exoticShare < 0.15) adj += 2;
  var score = Math.round(clamp(52 + (roi - 0.5) * 60 + discount * 60 - (risk - 35) * 0.45 + adj, 0, 100));
  return { score: score, util: wb.util, days: days, gross: gross, netRev: netRev, opex: opex, valChg: valChg, discount: discount, roi: roi, payback: payback, risk: risk, riskLabel: riskLabel, notes: notes, rate: rate, wk: wk, cond: cond, monthlyBookings: wb.days * 52 / 12, profit: profit };
}
function verdict(l, a) {
  var M = MODELS[l.model];
  var head = a.score >= 80 ? 'Strong buy' : a.score >= 65 ? 'Good opportunity' : a.score >= 50 ? 'Fair deal' : a.score >= 35 ? 'Proceed with caution' : 'Pass';
  var parts = [];
  if (a.discount > 0.12) parts.push('It’s priced ' + pct(a.discount) + ' below market, so you start with built-in equity.');
  else if (a.discount < -0.08) parts.push('It’s ' + pct(-a.discount) + ' over market value; negotiate hard or walk.');
  if (a.util > 0.5) parts.push('Expected utilization of ' + pct(a.util) + ' means steady cash flow.');
  else if (a.util < 0.32) parts.push('Utilization should be modest (' + pct(a.util) + '), so revenue depends on a few big bookings.');
  if (M.dep < 0) parts.push('As a collectible it should appreciate about ' + pct(-M.dep, 0) + ' a year.');
  else if (M.dep >= 0.08) parts.push('Depreciation is steep at about ' + pct(M.dep) + ' a year.');
  if (a.payback < 18) parts.push('Payback in roughly ' + Math.round(a.payback) + ' months.');
  if (!l.inspected) parts.push('Inspect it first: hidden issues aren’t priced in.');
  else if (l.hidden) parts.push('Inspection found ' + money(l.hidden) + ' of repairs; that’s factored in.');
  return { head: head, text: parts.slice(0, 3).join(' ') || 'Balanced risk and return for its class.' };
}
function scoreColor(s) { return s >= 75 ? '#6fcf8e' : s >= 55 ? '#d4a65a' : s >= 40 ? '#f0a35a' : '#ef6a5a'; }
function ring(s, lg) { return '<div class="ring' + (lg ? ' lg' : '') + '" style="--p:' + s + ';--c:' + scoreColor(s) + '"><b>' + s + '</b></div>'; }

/* ---------------- Actions ---------------- */
function buy(l, price, downPct, months) {
  if (S.cars.length >= bays()) return toast('No free bay. Expand the garage first.');
  var down = downPct >= 1 ? price : Math.round(price * downPct);
  if (S.cash < down) return toast('Not enough cash for that down payment.');
  var principal = price - down;
  if (principal > 0 && debt() + principal > maxDebt()) return toast('The lender won’t extend that much credit. Put more down.');
  S.cash -= down;
  var car = {
    id: S.nextId++, model: l.model, year: l.year, miles: l.miles, cond: l.cond, color: l.color,
    paid: price, bought: S.week, value: 0, listed: true, rate: suggestedRate(l.model), wkRate: suggestedWkRate(l.model),
    out: 0, serviced: S.week - 10, revenue: 0, costs: 0, days: [], vh: [], wrap: false
  };
  car.value = valueOf(car.model, car.year, car.miles, car.cond, S.week);
  car.vh.push(Math.round(car.value));
  S.cars.push(car);
  log('Bought ' + l.year + ' ' + fullName(l.model), -down, 'Purchase');
  if (principal > 0) {
    var r = apr(downPct);
    S.loans.push({ id: S.nextId++, carId: car.id, principal: principal, balance: principal, apr: r, pay: loanPayment(principal, r, months), months: months, start: S.week });
    log('Loan for ' + MODELS[l.model].name + ' (' + pct(r, 1) + ' APR)', 0, 'Financing');
  }
  if (l.hidden && !l.inspected) {
    S.cash -= l.hidden; car.cond = Math.max(40, car.cond - 12); car.costs += l.hidden;
    log('Hidden issue repaired on ' + MODELS[l.model].name, -l.hidden, 'Repairs');
    car.value = valueOf(car.model, car.year, car.miles, car.cond, S.week);
    setTimeout(function () { modal(sumModal('Surprise in the shop', '<div class="note warn">The ' + esc(fullName(l.model)) + ' had a hidden problem the seller didn’t mention. Repairs cost <b>' + money(l.hidden) + '</b> and condition dropped to ' + Math.round(car.cond) + '%. An inspection would have caught it.</div>'), 'sm'); }, 350);
  } else if (l.hidden && l.inspected) {
    S.cash -= l.hidden; car.cond = Math.max(40, car.cond - 12) + 8; car.costs += l.hidden;
    log('Pre-agreed repairs on ' + MODELS[l.model].name, -l.hidden, 'Repairs');
  }
  if ((l.market - price) / l.market >= 0.15) unlock('sharp');
  S.market = S.market.filter(function (x) { return x.id !== l.id; });
  S.compare = S.compare.filter(function (id) { return id !== l.id; });
  if (S.tutorial === 1) S.tutorial = 2;
  checkAwards();
  save();
  toast('<b>' + esc(fullName(l.model)) + '</b> is in bay ' + S.cars.length + '. It’s listed for rent at ' + money(car.rate) + '/day.');
  return car;
}
function sell(car) {
  var price = Math.round(car.value * SELL_SPREAD);
  var loan = loanOf(car.id), payoff = loan ? loan.balance : 0;
  S.cash += price - payoff;
  if (loan) S.loans = S.loans.filter(function (x) { return x !== loan; });
  log('Sold ' + fullName(car.model) + (payoff ? ' (loan repaid ' + money(payoff) + ')' : ''), price - payoff, 'Sale');
  if (price > car.paid * 1.1) unlock('flip');
  S.cars = S.cars.filter(function (c) { return c !== car; });
  checkAwards(); save();
  toast('Sold the ' + esc(MODELS[car.model].name) + ' for <b>' + money(price) + '</b>.');
}
function service(car) {
  var cost = Math.round(MODELS[car.model].maint * 1.5 + 150);
  if (S.cash < cost) return toast('Not enough cash for a service.');
  S.cash -= cost; car.costs += cost; car.cond = Math.min(100, car.cond + 15); car.serviced = S.week;
  bookMonth('exp', cost); S.totals.costs += cost;
  log('Serviced ' + MODELS[car.model].name, -cost, 'Maintenance');
  save(); toast('Serviced. Condition is now ' + Math.round(car.cond) + '%.');
}
function wrap(car, color) {
  if (S.cash < WRAP_COST) return toast('Not enough cash for a wrap.');
  S.cash -= WRAP_COST; car.costs += WRAP_COST; car.color = color; car.wrap = true;
  bookMonth('exp', WRAP_COST); S.totals.costs += WRAP_COST;
  log('New wrap on ' + MODELS[car.model].name, -WRAP_COST, 'Customization');
  save(); toast('Fresh look. Renters love it: +4% demand.');
}
function expand() {
  var next = TIERS[S.tier + 1];
  if (!next) return;
  if (S.cash < next.cost) return toast('You need ' + money(next.cost) + ' to expand.');
  S.cash -= next.cost; S.tier++;
  log('Expanded to ' + next.name + ' (' + next.bays + ' bays)', -next.cost, 'Expansion');
  bookMonth('exp', next.cost); S.totals.costs += next.cost;
  checkAwards(); save();
  toast('Welcome to the <b>' + next.name + '</b>: ' + next.bays + ' bays.');
}
function payOff(loan) {
  if (S.cash < loan.balance) return toast('Not enough cash to pay this off.');
  S.cash -= loan.balance; log('Paid off loan early', -loan.balance, 'Financing');
  S.loans = S.loans.filter(function (x) { return x !== loan; });
  save(); toast('Loan paid off. One less monthly bill.');
}
function inspect(l) {
  if (S.cash < INSPECTION) return toast('Not enough cash for an inspection.');
  S.cash -= INSPECTION; l.inspected = true; S.totals.costs += INSPECTION; bookMonth('exp', INSPECTION);
  log('Inspection: ' + MODELS[l.model].name, -INSPECTION, 'Due diligence');
  save();
}

/* ---------------- One week of business ---------------- */
function advanceWeek() {
  if (S.over) return null;
  var sum = { rev: 0, days: 0, fees: 0, ins: 0, maint: 0, loans: 0, interest: 0, garage: 0, repairs: 0, events: [], start: netWorth() };
  var season = seasonOf(S.week);
  var repDelta = 0;
  S.cars.forEach(function (c) {
    var M = MODELS[c.model];
    var booked = [false, false, false, false, false, false, false];
    if (c.out > 0) {
      c.out--;
    } else if (c.listed) {
      for (var d = 0; d < 7; d++) {
        var weekend = d >= 5, rate = weekend ? c.wkRate : c.rate;
        if (Math.random() < dayProb(c.model, c.cond, rate, weekend, { wrap: c.wrap })) {
          booked[d] = true; sum.days++;
          var net = netPerDay(rate);
          sum.rev += rate; sum.fees += rate - net; c.revenue += net;
          c.cond -= 0.13; c.miles += 110;
          if (Math.random() < damageP(c.model)) {
            var dmg = Math.round(c.value * rand(0.01, 0.06) / 50) * 50, pay = Math.min(dmg, deductible(c.model));
            sum.repairs += pay; c.costs += pay; c.cond -= rand(3, 8); repDelta -= 0.15;
            sum.events.push({ i: '⚠', t: 'A renter damaged your ' + M.name + '. Repairs were ' + money(dmg) + '; you paid the ' + money(pay) + ' deductible.' });
          }
        }
      }
    }
    c.days = c.days.concat(booked.map(function (b) { return b ? 1 : (c.listed ? 0 : 2); })).slice(-28);
    if (c.out === 0 && Math.random() < failP(c)) {
      var cost = Math.round(c.value * rand(0.008, 0.03) * (M.exotic ? 1.3 : 1) / 50) * 50 + 300;
      sum.repairs += cost; c.costs += cost; c.out = 1; c.cond = Math.max(30, c.cond - 4); if (c.listed) repDelta -= 0.06;
      sum.events.push({ i: '🔧', t: 'Mechanical failure on your ' + M.name + ': ' + money(cost) + ' repair, out of service next week.' });
    }
    var ins = M.ins * S.mods.ins * (c.listed ? 1 : 0.5) * 12 / 52, mt = M.maint * 12 / 52;
    sum.ins += ins; sum.maint += mt; c.costs += ins + mt;
    c.cond = clamp(c.cond - 0.15, 25, 100); c.miles += 25;
  });
  S.loans.forEach(function (l) {
    var interest = l.balance * l.apr / 52, princ = Math.min(l.balance, l.pay - interest);
    l.balance = Math.max(0, l.balance - princ); sum.loans += interest + princ; sum.interest += interest;
  });
  var paidOff = S.loans.filter(function (l) { return l.balance < 1; });
  S.loans = S.loans.filter(function (l) { return l.balance >= 1; });
  paidOff.forEach(function () { sum.events.push({ i: '✓', t: 'A car loan is fully paid off.' }); });
  sum.garage = TIERS[S.tier].fee;

  var netRental = sum.rev - sum.fees;
  var costs = sum.ins + sum.maint + sum.loans + sum.garage + sum.repairs;
  S.cash += netRental - costs;
  S.totals.revenue += netRental; S.totals.bookings += sum.days; S.totals.costs += costs - sum.loans + sum.interest;
  bookMonth('rev', netRental); bookMonth('exp', costs - (sum.loans - sum.interest));
  if (netRental) log('Week ' + (S.week + 1) + ' rentals (' + sum.days + ' days)', netRental, 'Rentals');
  log('Insurance, maintenance & garage', -(sum.ins + sum.maint + sum.garage), 'Operating');
  if (sum.loans) log('Loan payments', -sum.loans, 'Financing');
  if (sum.repairs) log('Repairs & deductibles', -sum.repairs, 'Repairs');

  if (S.mods.heat > 0) S.mods.heat--;
  if (S.mods.show > 0) S.mods.show--;
  randomEvent(sum);
  if ((S.week + 1) % 4 === 0) Object.keys(S.trend).forEach(function (k) { S.trend[k] = clamp(S.trend[k] * rand(0.985, 1.018), 0.82, 1.25); });

  S.week++;
  S.cars.forEach(function (c) { c.value = valueOf(c.model, c.year, c.miles, c.cond, S.week); if (S.week % 2 === 0) { c.vh.push(Math.round(c.value)); if (c.vh.length > 60) c.vh.shift(); } });
  refreshMarket();

  if (S.cars.length) {
    var avgCond = S.cars.reduce(function (t, c) { return t + c.cond; }, 0) / S.cars.length;
    repDelta += sum.days * (avgCond > 70 ? 0.0016 : 0.0006) - (avgCond < 60 ? 0.05 : 0);
  }
  S.rep = clamp(S.rep + repDelta, 1, 5);

  if (S.cash < 0) {
    var od = Math.round(-S.cash * 0.02); S.cash -= od; S.negWeeks++;
    log('Overdraft fee', -od, 'Financing');
    sum.events.push({ i: '‼', t: 'Your account is overdrawn (' + money(S.cash) + '). Get back above $0 within ' + (3 - S.negWeeks) + ' week' + (3 - S.negWeeks === 1 ? '' : 's') + ' or the business goes under: sell a car or pay down costs.' });
  } else S.negWeeks = 0;

  var nw = netWorth();
  S.history.push({ w: S.week, nw: Math.round(nw), cash: Math.round(S.cash) });
  if (S.history.length > 520) S.history.shift();
  sum.end = nw; sum.net = netRental - costs;

    row('Adviser score', function (a) { return { n: a.score, t: a.score + '/100' }; }, gt) +
    row('Price', function (a, i) { return { n: ls[A.indexOf(a)].ask, t: money(ls[A.indexOf(a)].ask) }; }, lt) +
    row('Vs. market', function (a) { return { n: a.discount, t: (a.discount >= 0 ? '−' : '+') + pct(Math.abs(a.discount)) }; }, gt) +
    row('Utilization', function (a) { return { n: a.util, t: pct(a.util) }; }, gt) +
    row('Net rental revenue / yr', function (a) { return { n: a.netRev, t: money(a.netRev) }; }, gt) +
    row('Operating costs / yr', function (a) { return { n: a.opex, t: money(a.opex) }; }, lt) +
    row('Value change / yr', function (a) { return { n: a.valChg, t: (a.valChg >= 0 ? '+' : '') + money(a.valChg) }; }, gt) +
    row('Projected ROI', function (a) { return { n: a.roi, t: pct(a.roi, 1) }; }, gt) +
    row('Payback', function (a) { return { n: a.payback, t: isFinite(a.payback) ? Math.round(a.payback) + ' mo' : 'Never' }; }, lt) +
    row('Risk', function (a) { return { n: a.risk, t: a.riskLabel + ' (' + a.risk + ')' }; }, lt) + '</tbody></table>';
  var w = A[0].score >= A[1].score ? 0 : 1, o = 1 - w;
  var reasons = [];
  if (A[w].roi > A[o].roi) reasons.push('a higher projected ROI (' + pct(A[w].roi) + ' vs ' + pct(A[o].roi) + ')');
  if (A[w].payback < A[o].payback) reasons.push('faster payback (' + Math.round(A[w].payback) + ' vs ' + (isFinite(A[o].payback) ? Math.round(A[o].payback) : '∞') + ' months)');
  if (A[w].discount > A[o].discount + 0.03) reasons.push('a better price relative to market');
  if (A[w].risk < A[o].risk) reasons.push('lower risk');
  var caveat = A[o].netRev > A[w].netRev ? ' The ' + MODELS[ls[o].model].name + ' brings in more revenue in absolute terms, but it costs more to own relative to what you pay.' : A[o].risk < A[w].risk ? ' The ' + MODELS[ls[o].model].name + ' is the safer pick if you want to protect cash.' : '';
  modal(head('AI adviser · head to head', 'Compare listings') + '<div class="m-body"><div class="table-wrap">' + t + '</div><div class="note info" style="margin-top:14px"><b>The ' + esc(MODELS[ls[w].model].name) + ' is the smarter buy</b>' + (reasons.length ? ' thanks to ' + reasons.join(', ') + '.' : '.') + caveat + '</div></div><div class="m-foot"><span></span><div style="display:flex;gap:8px">' + ls.map(function (l) { return '<button class="btn sm" data-act="listing" data-id="' + l.id + '">Open ' + esc(MODELS[l.model].name) + '</button>'; }).join('') + '</div></div>');
}

function weekModal(sums) {
  var tot = sums.reduce(function (t, s) { ['rev', 'days', 'fees', 'ins', 'maint', 'loans', 'garage', 'repairs'].forEach(function (k) { t[k] = (t[k] || 0) + s[k]; }); t.events = t.events.concat(s.events); return t; }, { events: [] });
  var start = sums[0].start, end = sums[sums.length - 1].end, change = end - start;
  var net = tot.rev - tot.fees;
  var h = head(sums.length > 1 ? sums.length + ' weeks of business' : 'Week ' + S.week + ' report', (change >= 0 ? 'Net worth +' : 'Net worth ') + money(change), 'Now ' + money(end) + ' · cash ' + money(S.cash));
  h += '<div class="m-body"><div class="m-cols"><div class="sec"><h4>Operations</h4><div class="kv"><span>Rental days booked</span><b>' + tot.days + '</b><span>Gross bookings</span><b class="num">' + money(tot.rev) + '</b><span>Platform fees & cleaning</span><b class="num down">' + money(-tot.fees) + '</b><span>Net rental revenue</span><b class="num up">' + money(net) + '</b></div></div>' +
    '<div class="sec"><h4>Costs</h4><div class="kv"><span>Insurance</span><b class="num">' + money(tot.ins) + '</b><span>Maintenance reserve</span><b class="num">' + money(tot.maint) + '</b><span>Garage upkeep</span><b class="num">' + money(tot.garage) + '</b><span>Loan payments</span><b class="num">' + money(tot.loans) + '</b><span>Repairs & deductibles</span><b class="num">' + money(tot.repairs) + '</b></div></div></div>';
  if (tot.events.length) h += '<div class="sum-list">' + tot.events.map(function (e) { return '<div class="ev"><i>' + e.i + '</i><span>' + esc(e.t) + '</span></div>'; }).join('') + '</div>';
  else if (!S.cars.length) h += '<div class="note info">No cars, no income, but the garage still costs ' + money(TIERS[S.tier].fee) + ' a week. Head to the marketplace.</div>';
  h += '</div><div class="m-foot"><span class="dim" style="font-size:.8rem">' + dateOf(S.week).toLocaleString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) + '</span><div style="display:flex;gap:8px"><button class="btn ghost" data-act="close">Close</button><button class="btn gold" data-act="advance" data-n="1">Next week ▸</button></div></div>';
  modal(h);
}

function endModal() {
  if (S.over === 'won') {
    modal(head('Goal reached in week ' + S.week, 'Automotive empire built') + '<div class="m-body"><p class="big-num">' + money(netWorth()) + '</p><p class="dim" style="margin:6px 0 16px">From ' + money(START_CASH) + ' and two empty bays to ' + S.cars.length + ' cars in ' + (S.week / 52).toFixed(1) + ' years.</p><div class="kv"><span>Lifetime rental revenue</span><b class="num">' + money(S.totals.revenue) + '</b><span>Rental days booked</span><b>' + S.totals.bookings.toLocaleString() + '</b><span>Reputation</span><b>' + S.rep.toFixed(1) + ' ★</b><span>Achievements</span><b>' + Object.keys(S.awards).length + ' of ' + AWARDS.length + '</b></div></div><div class="m-foot"><a class="btn ghost" href="index.html">Visit Adrien’s garage</a><div style="display:flex;gap:8px"><button class="btn" data-act="new-game-now">New game</button><button class="btn gold" data-act="keep-playing">Keep building</button></div></div>', 'sm');
  } else {
    modal(head('Week ' + S.week, 'The business went under') + '<div class="m-body"><p class="dim">Cash stayed negative for three weeks and the lenders called in your loans. It happens to real dealers too: leverage magnifies losses as well as gains.</p><div class="note info">Tip: keep at least a month of fixed costs in cash, inspect cheap cars, and don’t finance everything at 20% down.</div></div><div class="m-foot"><span></span><button class="btn gold" data-act="new-game-now">Start over</button></div>', 'sm');
  }
}

function behindModal() {
  modal(head('Behind the Garage', 'How this game works') + '<div class="m-body" style="font-size:.9rem;color:var(--body);display:grid;gap:12px">' +
    '<p>Garage Tycoon is a small business simulation about buying sports cars, renting them out and growing net worth. I built it to combine two things I care about: cars and the financial decisions behind owning them.</p>' +
    '<div class="sec"><h4>The economics</h4><p>Each car has a reference daily rate, a base demand, insurance and maintenance costs, and a yearly depreciation rate (collectibles appreciate). Bookings are simulated day by day: demand falls as you raise the price (elasticity ' + PRICE_ELASTICITY + '), rises on weekends and in summer, and depends on condition and your reputation. Every rental pays a ' + pct(PLATFORM_FEE) + ' platform fee and $' + CLEANING + ' cleaning, adds wear, and carries a small chance of damage, which costs you the insurance deductible.</p></div>' +
    '<div class="sec"><h4>Risk and financing</h4><p>Listings can hide mechanical problems (inspections reveal them), cars break down more as condition drops, and random events move demand, insurance and market values. Loans let you buy with 20–50% down at an APR that depends on your reputation and leverage. If cash stays negative for three weeks, you’re insolvent.</p></div>' +
    '<div class="sec"><h4>The AI adviser</h4><p>A transparent, rule-based model rather than a black box: it projects a year of rental cash flow at the suggested rate, subtracts operating costs and expected damage, adds the value change and any discount to market, and weighs risk and your own situation. Open any listing and choose “Show the math”.</p></div>' +
    '<p class="dim">Made by Adrien Pinilla, NYU Stern. <a href="index.html" style="color:var(--gold-2)">Visit my portfolio garage →</a></p></div><div class="m-foot"><span></span><button class="btn gold" data-act="close">Back to the game</button></div>');
}

/* ---------------- Tutorial ---------------- */
var COACH = [
  { t: 'Welcome to Garage Tycoon', p: 'You have <b>$100,000</b> and a two-car garage. Buy sports cars, rent them out, and grow your net worth to <b>$5 million</b>.', btn: 'Let’s go' },
  { t: 'Step 1 · Buy a car', p: 'Open the <b>Marketplace</b>. Your AI adviser scores every listing out of 100. A Corvette or 911 under $100K is a solid first buy.', tab: 'market' },
  { t: 'Step 2 · Set the price', p: 'Nice purchase. Open <b>Rentals</b> to tune the daily and weekend rate. Cheaper books more; pricier earns more per day.', tab: 'rentals' },
  { t: 'Step 3 · Run the business', p: 'Press <b>Next week</b> to simulate seven days of bookings, costs and surprises.' },
  { t: 'Step 4 · Watch the money', p: 'Check <b>Finances</b> for profit and net worth. Reinvest, take on loans carefully, and expand the garage when your bays fill up.', btn: 'Got it', tab: 'finances' }
];
function renderCoach() {
  var el = $('#coach');
  if (S.tutorial >= COACH.length || S.over) { el.innerHTML = ''; return; }
  var c = COACH[S.tutorial];
  el.innerHTML = '<div class="coach" role="status"><small>Tutorial · ' + (S.tutorial + 1) + ' of ' + COACH.length + '</small><h3>' + c.t + '</h3><p>' + c.p + '</p><div class="row"><button class="btn ghost sm" data-act="tutorial-skip">Skip tutorial</button>' +
    (c.btn ? '<button class="btn gold sm" data-act="tutorial-next">' + c.btn + '</button>' : c.tab && tab !== c.tab ? '<button class="btn gold sm" data-act="tab" data-tab="' + c.tab + '">Open ' + TABS.filter(function (t) { return t[0] === c.tab; })[0][1] + '</button>' : '<span></span>') + '</div></div>';
}

/* ---------------- Toasts ---------------- */
function toast(html) {
  var t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html;
  $('#toasts').appendChild(t);
  setTimeout(function () { t.style.transition = 'opacity .4s'; t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 450); }, 3600);
  return false;
}

/* ---------------- Events ---------------- */
function findListing(id) { return S.market.filter(function (l) { return l.id === +id; })[0]; }
function findCar(id) { return S.cars.filter(function (c) { return c.id === +id; })[0]; }
var ACT = {
  tab: function (d) { tab = d.tab; if ($('#veil').classList.contains('open')) closeModal(); else render(); window.scrollTo({ top: 0 }); },
  advance: function (d) {
    if (S.over) return endModal();
    var sums = [];
    for (var i = 0; i < +d.n && !S.over; i++) sums.push(advanceWeek());
    render();
    if (S.over) return endModal();
    weekModal(sums);
  },
  car: function (d) { carModal(findCar(d.id)); },
  listing: function (d) { var l = findListing(d.id); if (l) { modalCtx = null; listingModal(l); } else toast('That listing just sold to someone else.'); },
  close: function () { closeModal(); },
  expand: function () { expand(); render(); },
  mfilter: function (d) { mFilter = d.f; render(); },
  compare: function (d, el) { var id = +d.id, i = S.compare.indexOf(id); if (el.checked) { if (S.compare.length >= 2) { el.checked = false; return toast('Pick two listings to compare.'); } S.compare.push(id); } else if (i >= 0) S.compare.splice(i, 1); render(); },
  'compare-clear': function () { S.compare = []; render(); },
  'compare-open': function () { compareModal(); },
  inspect: function (d) { var l = findListing(d.id); inspect(l); listingModal(l); },
  offer: function (d) {
    var l = findListing(d.id), offer = modalCtx.offer; l.offered = true;
    if (offer >= l.reserve) { modalCtx.price = offer; l.ask = offer; toast('Offer accepted at <b>' + money(offer) + '</b>.'); }
    else if (offer >= l.reserve - l.ask * 0.07) { l.counter = l.reserve; modalCtx.price = l.reserve; toast('The seller countered at <b>' + money(l.reserve) + '</b>.'); }
    else if (offer < l.reserve * 0.82) { S.market = S.market.filter(function (x) { return x !== l; }); save(); closeModal(); return toast('Insulted, the seller pulled the listing.'); }
    else toast('Offer rejected. The price stays at ' + money(l.ask) + '.');
    save(); listingModal(l);
  },
  down: function (d) { modalCtx.down = +d.v; listingModal(findListing(modalCtx.id)); },
  term: function (d) { modalCtx.months = +d.v; listingModal(findListing(modalCtx.id)); },
  buy: function (d) { var l = findListing(d.id), car = buy(l, modalCtx.price, modalCtx.down, modalCtx.months); if (car) { tab = 'garage'; if (!(l.hidden && !l.inspected)) closeModal(); else render(); } },
  list: function (d, el) { var c = findCar(d.id); c.listed = el.checked; save(); if (modalCtx && modalCtx.type === 'car') carModal(c); else render(); },
  service: function (d) { var c = findCar(d.id); service(c); carModal(c); },
  wrap: function (d) { var c = findCar(d.id); if (c.color === d.color) return; wrap(c, d.color); carModal(c); },
  sell: function (d) {
    var c = findCar(d.id), btn = document.querySelector('[data-act="sell"]');
    if (!btn.dataset.sure) { btn.dataset.sure = '1'; btn.textContent = 'Tap again to confirm'; return; }
    sell(c); closeModal();
  },
  payoff: function (d) { var l = S.loans.filter(function (x) { return x.id === +d.id; })[0]; payOff(l); render(); },
  menu: function (d, el) { var dr = $('#drawer'), open = !dr.classList.contains('open'); dr.classList.toggle('open', open); el.setAttribute('aria-expanded', open); },
  behind: function () { $('#drawer').classList.remove('open'); behindModal(); },
  'new-game': function () { $('#drawer').classList.remove('open'); modal(head('Start over?', 'New game') + '<div class="m-body"><p class="dim">This wipes your current garage and starts again with $100,000.</p></div><div class="m-foot"><span></span><div style="display:flex;gap:8px"><button class="btn ghost" data-act="close">Cancel</button><button class="btn danger" data-act="new-game-now">Start over</button></div></div>', 'sm'); },
  'new-game-now': function () { newGame(); S.tutorial = 1; tab = 'garage'; save(); closeModal(); },
  'keep-playing': function () { S.over = null; save(); closeModal(); },
  'tutorial-next': function () { S.tutorial++; if (S.tutorial === 1) tab = 'garage'; save(); render(); },
  'tutorial-skip': function () { S.tutorial = COACH.length; save(); render(); },
  'tutorial-restart': function () { $('#drawer').classList.remove('open'); S.tutorial = 0; save(); render(); }
};
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t) { if (!e.target.closest('.drawer') && !e.target.closest('.menu-btn')) $('#drawer').classList.remove('open'); if (e.target === $('#veil')) closeModal(); return; }
  if (t.disabled) return;
  if (t.tagName === 'INPUT' && t.type === 'checkbox') { ACT[t.dataset.act](t.dataset, t, e); return; }
  e.preventDefault();
  ACT[t.dataset.act](t.dataset, t, e);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && $('#veil').classList.contains('open')) closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('rank')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', function (e) {
  var t = e.target, k = t.dataset.input;
  if (!k) return;
  if (k === 'msort') { mSort = t.value; render(); return; }
  if (k === 'offer') { modalCtx.offer = +t.value; var l = findListing(modalCtx.id); document.querySelector('[data-out="offer"]').textContent = money(+t.value) + ' (' + pct(1 - t.value / l.ask) + ' off)'; return; }
  var c = findCar(t.dataset.id);
  if (k === 'rate') { c.rate = +t.value; document.querySelectorAll('[data-out="rate-' + c.id + '"]').forEach(function (o) { o.textContent = money(c.rate); }); }
  if (k === 'wkrate') { c.wkRate = +t.value; document.querySelectorAll('[data-out="wk-' + c.id + '"]').forEach(function (o) { o.textContent = money(c.wkRate); }); }
  document.querySelectorAll('[data-out="est-' + c.id + '"]').forEach(function (o) { o.innerHTML = estHTML(c); });
  save();
});
addEventListener('resize', function () { document.querySelectorAll('.short-l').forEach(function (e) { e.style.display = innerWidth <= 860 ? '' : 'none'; }); document.querySelectorAll('.tab .long').forEach(function (e) { e.style.display = innerWidth <= 860 ? 'none' : ''; }); });

/* ---------------- Boot ---------------- */
if (!load()) newGame();
render();
if (S.over) endModal();
</script>
</body>
</html>
