<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage Tycoon</title>
<meta name="description" content="Build a $5 million sports car rental empire: buy cars, set rental prices, manage risk and grow your net worth. A game by Adrien Pinilla.">
<meta property="og:title" content="Garage Tycoon">
<meta property="og:description" content="Turn $100,000 and a two-car garage into a $5M sports car rental empire.">
<meta name="theme-color" content="#0e0c0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0e0c0a;
  --panel: #17130f;
  --panel-2: #1e1914;
  --line: rgba(244, 236, 222, 0.1);
  --line-2: rgba(212, 166, 90, 0.28);
  --ivory: #f4ece0;
  --body: #d8cfc2;
  --muted: #a99d8c;
  --gold: #d4a65a;
  --gold-2: #f0c983;
  --green: #6fcf8e;
  --red: #ef6a5a;
  --blue: #6aa8ff;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --sans: "Inter", -apple-system, "Segoe UI", sans-serif;
  --floor: linear-gradient(180deg, #1b1714, #110f0d);
  --lamp: 0.16;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ivory); font: 400 14.5px/1.5 var(--sans); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--green); } .down { color: var(--red); } .dim { color: var(--muted); }

/* tier-driven look: the garage gets warmer and richer as it grows */
body[data-tier="1"] { --lamp: 0.2; }
body[data-tier="2"] { --lamp: 0.24; --floor: repeating-linear-gradient(45deg, rgba(150, 102, 58, .1) 0 12px, transparent 12px 24px), repeating-linear-gradient(-45deg, rgba(150, 102, 58, .07) 0 12px, transparent 12px 24px), linear-gradient(180deg, #221a13, #120e0b); }
body[data-tier="3"], body[data-tier="4"] { --lamp: 0.28; --floor: repeating-linear-gradient(45deg, rgba(176, 120, 64, .14) 0 12px, transparent 12px 24px), repeating-linear-gradient(-45deg, rgba(176, 120, 64, .1) 0 12px, transparent 12px 24px), linear-gradient(180deg, #2a1f15, #130e0a); }

/* ================= HUD ================= */
.hud { position: sticky; top: 0; z-index: 30; background: rgba(14, 12, 10, .9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.hud-row { max-width: 1240px; margin: 0 auto; padding: 12px 22px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font: 700 1.4rem/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; }
.brand small { font: 600 .7rem/1 var(--cond); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin-top: 4px; }
.kpis { display: flex; gap: 22px; margin-left: auto; align-items: center; }
.kpi small { display: block; font: 600 .66rem/1 var(--cond); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.kpi b { font: 700 1.25rem/1.15 var(--cond); letter-spacing: .02em; }
.stars { color: var(--gold); letter-spacing: 1px; font-size: .95rem; }
.stars i { font-style: normal; color: rgba(212, 166, 90, .25); }
.time { display: flex; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 15px; border: 1px solid var(--line-2); font: 600 .84rem/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; transition: background .2s, border-color .2s, color .2s, transform .1s; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--gold); color: var(--gold-2); }
.btn:active { transform: translateY(1px); }
.btn.gold { background: linear-gradient(180deg, #e2b56a, #c08f45); color: #1a1209; border-color: #c08f45; }
.btn.gold:hover { filter: brightness(1.08); color: #1a1209; }
.btn.ghost { border-color: var(--line); color: var(--body); }
.btn.danger { border-color: rgba(239, 106, 90, .5); color: #ffb4a8; }
.btn.danger:hover { border-color: var(--red); color: #fff; background: rgba(239, 106, 90, .15); }
.btn.sm { padding: 7px 10px; font-size: .74rem; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.date { text-align: right; }
.date b { font: 700 1rem/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; display: block; }
.date small { font-size: .7rem; color: var(--muted); }
.menu-btn { width: 38px; height: 38px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 1.1rem; }

.tabs { max-width: 1240px; margin: 0 auto; padding: 0 22px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 11px 14px 12px; font: 600 .86rem/1 var(--cond); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; display: flex; gap: 7px; align-items: center; white-space: nowrap; }
.tab:hover { color: var(--ivory); }
.tab.on { color: var(--ivory); border-color: var(--gold); }
.tab svg { width: 15px; height: 15px; }
.tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

main { max-width: 1240px; margin: 0 auto; padding: 24px 22px 80px; }
.view-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.view-head h1 { font: 700 2.1rem/1 var(--cond); letter-spacing: .03em; text-transform: uppercase; }
.view-head p { color: var(--muted); font-size: .9rem; margin-top: 4px; max-width: 640px; }
.eyebrow { font: 600 .72rem/1 var(--cond); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.card { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--body); white-space: nowrap; }
.chip.gold { border-color: var(--line-2); color: var(--gold-2); }
.chip.good { border-color: rgba(111, 207, 142, .4); color: #a8ecbd; }
.chip.bad { border-color: rgba(239, 106, 90, .4); color: #ffb4a8; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }

/* ================= Garage ================= */
.hq { position: relative; overflow: hidden; border-radius: 4px; border: 1px solid var(--line); padding: 26px 26px 22px; margin-bottom: 20px; min-height: 180px; display: flex; flex-direction: column; justify-content: flex-end; }
.hq::before { content: ""; position: absolute; inset: 0; background: url(assets/garage-overview.webp) center 62% / cover no-repeat; opacity: var(--hq-img, .14); filter: saturate(.85); }
.hq::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14, 12, 10, .95) 25%, rgba(14, 12, 10, .55) 70%, rgba(14, 12, 10, .3)), linear-gradient(0deg, rgba(14, 12, 10, .9), transparent 60%); }
.hq > * { position: relative; z-index: 1; }
.hq h1 { font: 700 2.4rem/1 var(--cond); text-transform: uppercase; letter-spacing: .03em; margin-top: 6px; }
.hq-meta { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px; align-items: end; }
.goal { flex: 1; min-width: 240px; max-width: 520px; }
.goal small { font-size: .74rem; color: var(--muted); display: flex; justify-content: space-between; }
.bar { height: 6px; background: rgba(244, 236, 222, .1); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, #b07f3a, var(--gold-2)); border-radius: 3px; transition: width .6s; }
.bays { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 16px; }
.bay { position: relative; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); text-align: left; display: flex; flex-direction: column; transition: border-color .2s, transform .2s; }
button.bay:hover { border-color: var(--line-2); transform: translateY(-2px); }
.bay-stage { position: relative; aspect-ratio: 16 / 8.6; background: radial-gradient(ellipse 55% 70% at 50% -5%, rgba(255, 214, 150, var(--lamp)), transparent 72%), var(--floor); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.bay-stage::before { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 14%; background: rgba(244, 236, 222, .2); }
.bay-stage::after { content: ""; position: absolute; left: calc(50% - 8px); top: 14%; width: 17px; height: 9px; border-radius: 8px 8px 2px 2px; background: radial-gradient(circle at 50% 80%, #ffe1ad, #d4a65a 60%, #6e4b22); box-shadow: 0 4px 26px 8px rgba(255, 200, 120, calc(var(--lamp) * 1.6)); }
.bay-stage svg { width: 88%; margin-bottom: 4%; position: relative; z-index: 1; filter: drop-shadow(0 10px 12px rgba(0, 0, 0, .55)); }
.bay-no { position: absolute; left: 10px; top: 8px; font: 700 .7rem/1 var(--cond); letter-spacing: .2em; color: rgba(244, 236, 222, .35); z-index: 2; }
.bay-status { position: absolute; right: 10px; top: 8px; z-index: 2; }
.plaque { padding: 12px 14px 14px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.plaque b { font: 700 1.12rem/1.15 var(--cond); letter-spacing: .02em; text-transform: uppercase; }
.plaque .v { font: 700 1.12rem/1.15 var(--cond); text-align: right; }
.plaque small { font-size: .74rem; color: var(--muted); }
.plaque .mini-bar { grid-column: 1 / -1; height: 3px; margin-top: 8px; background: rgba(244, 236, 222, .08); border-radius: 2px; overflow: hidden; }
.plaque .mini-bar span { display: block; height: 100%; background: var(--gold); }
.bay.empty-bay { border-style: dashed; align-items: center; justify-content: center; min-height: 230px; color: var(--muted); gap: 8px; text-align: center; padding: 20px; }
.bay.empty-bay b { font: 700 1.1rem/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--body); }
.bay.locked { opacity: .75; }
.plus { width: 46px; height: 46px; border-radius: 50%; border: 1px dashed var(--line-2); display: grid; place-items: center; font-size: 1.4rem; color: var(--gold); }
.status { font: 600 .66rem/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; padding: 5px 7px; border-radius: 2px; background: rgba(14, 12, 10, .75); border: 1px solid var(--line); }
.status.rented { color: #a8ecbd; border-color: rgba(111, 207, 142, .35); }
.status.idle { color: var(--muted); }
.status.service { color: #ffcf8a; border-color: rgba(240, 201, 131, .4); }
.status.off { color: #9fb6d9; }

/* ================= Marketplace ================= */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { padding: 8px 12px; font: 600 .78rem/1 var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.seg button.on { background: rgba(212, 166, 90, .14); color: var(--gold-2); }
select { background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; border-radius: 3px; font-size: .82rem; }
.market { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.listing { display: flex; flex-direction: column; overflow: hidden; position: relative; }
.listing .bay-stage { aspect-ratio: 16 / 7; }
.listing .tagline { position: absolute; left: 10px; top: 10px; z-index: 2; display: flex; gap: 6px; }
.l-body { padding: 14px 16px 16px; display: grid; gap: 10px; flex: 1; }
.l-title { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.l-title b { font: 700 1.25rem/1.1 var(--cond); text-transform: uppercase; letter-spacing: .02em; }
.l-title small { display: block; color: var(--muted); font-size: .76rem; }
.price b { font: 700 1.4rem/1 var(--cond); display: block; text-align: right; }
.price small { font-size: .72rem; display: block; text-align: right; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: rgba(244, 236, 222, .03); border: 1px solid var(--line); border-radius: 3px; padding: 7px 8px; }
.stats small { display: block; font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stats b { font: 700 1rem/1.2 var(--cond); }
.adv-line { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 3px; background: rgba(212, 166, 90, .06); border: 1px solid rgba(212, 166, 90, .14); }
.adv-line p { font-size: .8rem; color: var(--body); line-height: 1.35; }
.ring { --p: 50; --c: var(--gold); width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--c) calc(var(--p) * 1%), rgba(244, 236, 222, .1) 0); position: relative; }
.ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--panel-2); }
.ring b { position: relative; font: 700 1.05rem/1 var(--cond); }
.ring.lg { width: 84px; height: 84px; }
.ring.lg::before { inset: 6px; }
.ring.lg b { font-size: 2rem; }
.l-actions { display: flex; gap: 8px; align-items: center; }
.l-actions .btn { flex: 1; }
.cmp { display: flex; gap: 6px; align-items: center; font-size: .74rem; color: var(--muted); white-space: nowrap; cursor: pointer; }
.cmp input { accent-color: var(--gold); }
.cmpbar { position: sticky; bottom: 16px; z-index: 20; margin-top: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; background: rgba(23, 19, 15, .95); border: 1px solid var(--line-2); border-radius: 4px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }

/* ================= Tables / rentals ================= */
.rent-grid { display: grid; gap: 14px; }
.rent { display: grid; grid-template-columns: 220px 1fr 250px; gap: 18px; padding: 16px; align-items: center; }
.rent-car { display: flex; flex-direction: column; gap: 6px; }
.rent-car svg { width: 100%; }
.rent-car b { font: 700 1.1rem/1.1 var(--cond); text-transform: uppercase; }
.sliders { display: grid; gap: 12px; }
.slider label { display: flex; justify-content: space-between; font-size: .76rem; color: var(--muted); margin-bottom: 4px; }
.slider label b { color: var(--ivory); font: 700 1rem/1 var(--cond); }
input[type=range] { width: 100%; accent-color: var(--gold); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--body); cursor: pointer; }
.switch input { appearance: none; -webkit-appearance: none; width: 34px; height: 19px; border-radius: 10px; background: rgba(244, 236, 222, .15); position: relative; cursor: pointer; transition: background .2s; }
.switch input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--ivory); transition: transform .2s; }
.switch input:checked { background: var(--gold); }
.switch input:checked::after { transform: translateX(15px); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal span { aspect-ratio: 1; border-radius: 2px; background: rgba(244, 236, 222, .06); font-size: .56rem; display: grid; place-items: center; color: var(--muted); }
.cal span.b { background: rgba(212, 166, 90, .55); color: #1a1209; }
.cal span.o { background: rgba(106, 168, 255, .25); }
.cal-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; font-size: .56rem; color: var(--muted); text-align: center; margin-bottom: 3px; letter-spacing: .08em; }
.est { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.est div small { display: block; font-size: .64rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.est div b { font: 700 1.05rem/1.2 var(--cond); }

/* ================= Finances ================= */
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.k { padding: 14px 16px; }
.k small { display: block; font: 600 .68rem/1 var(--cond); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.k b { font: 700 1.6rem/1.15 var(--cond); display: block; margin-top: 6px; }
.k em { font-style: normal; font-size: .72rem; }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.panel { padding: 16px 18px; }
.panel h3 { font: 700 1.05rem/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.panel h3 small { font: 500 .74rem/1 var(--sans); letter-spacing: 0; text-transform: none; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: .74rem; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
table { width: 100%; border-collapse: collapse; font-size: .84rem; }
th { text-align: left; font: 600 .66rem/1 var(--cond); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); color: var(--body); vertical-align: middle; }
td.r, th.r { text-align: right; }
.table-wrap { overflow-x: auto; }

/* ================= Adviser ================= */
.adv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tip { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.tip:last-child { border-bottom: 0; }
.tip i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; background: rgba(212, 166, 90, .15); color: var(--gold-2); font-size: .8rem; font-weight: 700; }
.tip p { font-size: .86rem; color: var(--body); }
.tip p b { color: var(--ivory); }
.rank { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.rank:last-child { border-bottom: 0; }
.rank:hover b { color: var(--gold-2); }
.rank b { font: 700 1rem/1.1 var(--cond); text-transform: uppercase; }
.rank small { display: block; font-size: .72rem; color: var(--muted); }

/* ================= Achievements ================= */
.awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.award { padding: 18px; display: flex; gap: 14px; align-items: center; }
.medal { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 1.2rem/1 var(--cond); background: radial-gradient(circle at 35% 30%, #fbe1a9, #c08f45 55%, #6e4b22); color: #2a1a08; box-shadow: 0 0 0 3px rgba(212, 166, 90, .2), 0 6px 18px rgba(212, 166, 90, .25); }
.award.locked .medal { background: rgba(244, 236, 222, .06); color: var(--muted); box-shadow: none; border: 1px dashed var(--line); }
.award b { font: 700 1.05rem/1.1 var(--cond); text-transform: uppercase; letter-spacing: .03em; }
.award p { font-size: .8rem; color: var(--muted); }
.award small { font-size: .7rem; color: var(--gold); }

/* ================= Modals ================= */
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(6, 5, 4, .72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .25s; }
.veil.open { opacity: 1; pointer-events: auto; }
.modal { width: min(880px, 100%); max-height: calc(100dvh - 40px); overflow-y: auto; background: linear-gradient(180deg, #1f1a15, #15110e); border: 1px solid var(--line-2); border-radius: 6px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); transform: translateY(14px) scale(.98); transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
.veil.open .modal { transform: none; }
.modal.sm { width: min(520px, 100%); }
.m-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 20px 22px 0; }
.m-head h2 { font: 700 1.9rem/1 var(--cond); text-transform: uppercase; letter-spacing: .02em; margin-top: 6px; }
.m-head p { color: var(--muted); font-size: .84rem; margin-top: 4px; }
.x { width: 34px; height: 34px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 1rem; flex: none; }
.x:hover { border-color: var(--gold); }
.m-body { padding: 18px 22px 22px; }
.m-hero { position: relative; border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.m-hero .bay-stage { aspect-ratio: 16 / 6.2; }
.m-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.sec { padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; background: rgba(244, 236, 222, .02); }
.sec h4 { font: 700 .82rem/1 var(--cond); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; font-size: .84rem; }
.kv span { color: var(--muted); }
.kv b { font-weight: 600; text-align: right; }
.kv .sep { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 2px 0; }
.verdict { display: flex; gap: 16px; align-items: center; }
.verdict p { font-size: .88rem; color: var(--body); }

.drawer { position: absolute; right: 22px; top: 60px; width: 230px; background: #1b1611; border: 1px solid var(--line-2); border-radius: 4px; padding: 6px; display: none; box-shadow: 0 20px 40px rgba(0, 0, 0, .5); }

/* ================= Phone ================= */

/* ================= 3D previews (vehicle3d.js) ================= */
img.v3d { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; position: relative; z-index: 1; opacity: 0; transition: opacity .5s; display: block; }
img.v3d.ready { opacity: 1; }
.bay-stage.v3d-loading::before { content: ""; position: absolute; left: 50%; top: 55%; width: 26px; height: 26px; margin: -13px; border-radius: 50%; border: 2px solid rgba(212, 166, 90, .25); border-top-color: var(--gold); animation: spin .9s linear infinite; z-index: 2; background: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.bay-stage.v3d-failed::after { content: "3D preview unavailable"; position: absolute; inset: auto 0 40% 0; text-align: center; font-size: .78rem; color: var(--muted); background: none; box-shadow: none; width: auto; height: auto; left: 0; top: auto; border-radius: 0; }
.v3d-none { position: relative; z-index: 1; align-self: center; text-align: center; display: grid; gap: 4px; padding: 20px; color: var(--muted); font-size: .78rem; }
.v3d-none b { font: 700 1.1rem/1 var(--cond); text-transform: uppercase; color: var(--body); }
.stage-btn { width: 100%; cursor: zoom-in; border: 0; padding: 0; }
.stage-btn:hover img.v3d { transform: scale(1.03); }
img.v3d { transition: opacity .5s, transform .4s; }
.inspect-3d { position: absolute; right: 10px; bottom: 8px; z-index: 2; font: 600 .66rem/1 var(--cond); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); background: rgba(14, 12, 10, .7); padding: 5px 7px; border-radius: 2px; opacity: 0; transition: opacity .2s; }
.stage-btn:hover .inspect-3d, .stage-btn:focus-visible .inspect-3d { opacity: 1; }
.bay-stage.thumb { aspect-ratio: 13 / 6; border-radius: 3px; }
.bay-stage.cmp-shot { aspect-ratio: 21 / 9.5; border-radius: 3px; min-width: 150px; }
.viewer-wrap { position: relative; aspect-ratio: 16 / 7; border-radius: 4px; overflow: hidden; background: radial-gradient(ellipse 55% 70% at 50% -5%, rgba(255, 214, 150, .26), transparent 72%), var(--floor); transition: aspect-ratio .3s; }
.viewer-wrap.big { aspect-ratio: 16 / 10; }
.viewer { position: absolute; inset: 0; cursor: grab; touch-action: none; }
.viewer:active { cursor: grabbing; }
.v3d-canvas { width: 100% !important; height: 100% !important; display: block; }
.viewer.v3d-loading::after { content: ""; position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px; border-radius: 50%; border: 2px solid rgba(212, 166, 90, .25); border-top-color: var(--gold); animation: spin .9s linear infinite; }
.viewer.v3d-failed::after { content: "3D preview unavailable on this device"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: .84rem; }
.viewer-hint { position: absolute; left: 12px; bottom: 10px; font: 600 .66rem/1 var(--cond); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
.viewer-size { position: absolute; right: 10px; bottom: 8px; width: 32px; height: 32px; border: 1px solid var(--line); background: rgba(14, 12, 10, .7); color: var(--body); border-radius: 3px; }
.viewer-size:hover { border-color: var(--gold); }
.muted-btn { color: var(--muted); border-color: var(--line); }
.season-note { font-size: .78rem; color: var(--muted); margin: -6px 0 16px; }
.credit { font-size: .72rem; color: var(--muted); margin-top: 18px; }
.credit a { color: var(--body); }
.stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.adv-kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.adv-kpis div { background: rgba(244, 236, 222, .03); border: 1px solid var(--line); border-radius: 3px; padding: 8px 9px; }
.adv-kpis small { display: block; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.adv-kpis b { font: 700 1.1rem/1.2 var(--cond); display: block; }
.adv-kpis em { font-style: normal; font-size: .66rem; color: var(--muted); }
.parts { display: grid; gap: 8px; margin: 12px 0 4px; }
.part { display: grid; grid-template-columns: 150px 1fr 52px; gap: 4px 10px; align-items: center; font-size: .8rem; }
.part span { color: var(--body); }
.part b { text-align: right; font: 700 .95rem/1 var(--cond); color: var(--ivory); }
.part small { grid-column: 2 / -1; color: var(--muted); font-size: .72rem; }
.pbar { height: 6px; background: rgba(244, 236, 222, .08); border-radius: 3px; overflow: hidden; }

.cal span.x { background: rgba(239, 106, 90, .22); }
.cal-key { display: flex; gap: 12px; margin-top: 6px; font-size: .64rem; color: var(--muted); }
.cal-key i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: rgba(244, 236, 222, .06); }
.cal-key i.b { background: rgba(212, 166, 90, .55); } .cal-key i.x { background: rgba(239, 106, 90, .22); }
.cmp-table td.win { color: #a8ecbd; font-weight: 600; }
.cmp-table th { white-space: normal; min-width: 150px; }
.opt[disabled] { opacity: .45; cursor: not-allowed; }
.opt em { display: block; font-style: normal; font-size: .66rem; color: var(--muted); margin-top: 2px; }
.panel h3 select { font: 500 .78rem/1 var(--sans); letter-spacing: 0; text-transform: none; padding: 6px 8px; }

/* ================= Private collection ================= */
